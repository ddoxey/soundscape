events:
  - at_seconds: 0.0
    event: ambient_bed
    note: background loop

  - at_seconds: 0.0
    event: engine_bed
    note: background loop

  - at_seconds: 0.0
    event: thrust_texture
    note: background texture loop

  - at_seconds: 0.0
    event: tower_chatter
    note: tower chatter bed

  - at_seconds: 6.0
    event: airplane_ping_requested
    note: normal event; no ducking

  - at_seconds: 10.0
    event: autopilot_disconnect
    note: alert; ducks background and normal sounds

  - at_seconds: 14.0
    event: master_caution_single
    note: alert; stacks with other alerts

  - at_seconds: 18.0
    event: master_caution_loop
    note: sustained alert loop

  - at_seconds: 22.0
    event: terrain_pull_up
    note: critical; ducks alerts to 70%, normal to 50%, background to 35%

  - at_seconds: 22.0
    event: autopilot_disconnect_suppression_demo
    note: suppressed because a critical warning is already active

  - at_seconds: 30.0
    event: windshear
    note: critical warning; equal priority with pull-up, no mutual ducking

  - at_seconds: 38.0
    event: master_caution_cleared
    note: clear sustained alert loop

  - at_seconds: 42.0
    event: flight_attendant_chime
    note: normal event; should stay under any active warnings

  - at_seconds: 46.0
    event: bingo_low_fuel
    note: alert event

  - at_seconds: 50.0
    event: autopilot_disconnect_classic
    note: alert reprise with alternate source

  - at_seconds: 54.0
    event: bank_angle
    note: critical pulse

  - at_seconds: 57.0
    event: overspeed
    note: critical clacker near program end
