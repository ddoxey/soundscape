sounds:
  - id: airplane_ping
    name: Airplane Ping
    file_path: sounds/airplane_ping.wav
    loop: false
    gain: 0.65
    priority: normal
    duck_others: false
    drop_if_higher_priority_active: false

  - id: airport_tower
    name: Airport Tower
    file_path: sounds/airport__tower.wav
    loop: true
    gain: 0.22
    priority: background
    duck_others: false
    drop_if_higher_priority_active: false

  - id: ambient
    name: Ambient
    file_path: sounds/ambient.wav
    loop: true
    gain: 0.30
    priority: background
    duck_others: false
    drop_if_higher_priority_active: false

  - id: autopilot_disconnect_classic_boeing
    name: Autopilot Disconnect Classic Boeing
    file_path: sounds/autopilot_disconnect_classic_boeing.wav
    loop: false
    gain: 0.90
    priority: alert
    duck_others: true
    drop_if_higher_priority_active: true

  - id: autopilot_disconnect_modern_variant
